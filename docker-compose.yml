# ═══════════════════════════════════════════════════════════
# Adably — Docker Compose (Production)
# Includes: Backend, Frontend
# ═══════════════════════════════════════════════════════════
#
# Prerequisites (set in .env or environment):
#   DATABASE_URL, JWT_SECRET, MINIO_*, NEXT_PUBLIC_API_URL
#
# Usage:
#   docker compose up -d
# ═══════════════════════════════════════════════════════════

services:
  # ── NestJS Backend API ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adably-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    env_file:
      - ./backend/.env
    networks:
      - adably-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/content/tags"]
      interval: 30s
      timeout: 5s
      start_period: 15s

  # ── Next.js Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adably-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - adably-net

networks:
  adably-net:
    driver: bridge
